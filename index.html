<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Social Card Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/jameel-noori@1.1.2/jameel-noori.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;700&family=Gulzar&family=Montserrat:wght@400;700;900&family=Noto+Sans+Arabic:wght@400;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    
    <style>
      body { font-family: 'Noto Sans Arabic', sans-serif; }
      .font-jameel { font-family: 'Jameel Noori Nastaleeq', 'JameelNooriNastaliq', serif; }
      .font-gulzar { font-family: 'Gulzar', serif; }
      .font-baloo { font-family: 'Baloo Bhaijaan 2', cursive; }
      .font-noto { font-family: 'Noto Sans Arabic', sans-serif; }
      .font-amiri { font-family: 'Amiri', serif; }
      .font-montserrat { font-family: 'Montserrat', sans-serif; }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      function SocialCardStudio() {
        const containerRef = useRef(null);

        const [isAuthenticated, setIsAuthenticated] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem('socialCardAuth')) || false;
          } catch (e) { return false; }
        });

        const [width, setWidth] = useState(800);
        const [height, setHeight] = useState(800);
        const [fileName, setFileName] = useState("social-card");
        const [draggableHeadlines, setDraggableHeadlines] = useState(true);

        const [background, setBackground] = useState({
          type: 'gradient',
          color: '#0f172a',
          gradient: { color1: '#0f172a', color2: '#1e293b', direction: 'to bottom right' },
          imageSrc: ''
        });

        const [images, setImages] = useState([]);
        const [headlines, setHeadlines] = useState([{
          id: Date.now(),
          text: "اہم خبر اور تازہ ترین اپ ڈیٹ یہاں درج کریں",
          fontSize: 45,
          lineHeight: 1.4,
          fontFamily: "'Noto Sans Arabic', sans-serif",
          textColor: "#ffffff",
          bgColor: "transparent",
          rotation: 0,
          textPos: { x: 50, y: 500 },
          direction: "rtl",
          textAlign: "right",
          shadow: { enabled: true, offsetX: 2, offsetY: 2, blur: 8, color: "rgba(0,0,0,0.8)" },
          width: 700,
        }]);

        const [presets, setPresets] = useState({});
        const [currentPresetName, setCurrentPresetName] = useState("");
        const [activeTab, setActiveTab] = useState('text');

        function loadPreset(name) {
          const p = presets[name];
          if (!p) return;
          if (p.headlines) setHeadlines(p.headlines);
          if (p.images) setImages(p.images);
          if (p.width) setWidth(p.width);
          if (p.height) setHeight(p.height);
          if (p.background) setBackground(p.background);
          if (p.fileName) setFileName(p.fileName);
          setCurrentPresetName(name);
        }

        function savePreset() {
          if (!currentPresetName) return alert("براہ کرم پرسیٹ کا نام درج کریں");
          const newPreset = { headlines, images, width, height, background, fileName };
          const updated = { ...presets, [currentPresetName]: newPreset };
          setPresets(updated);
          localStorage.setItem("userPresets", JSON.stringify(updated));
          alert(`پرسیٹ "${currentPresetName}" محفوظ ہو گیا!`);
        }

        function onImageUpload(e) {
          const files = Array.from(e.target.files);
          files.forEach((file, index) => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
              setImages(prev => [...prev, {
                id: Date.now() + index,
                src: img.src,
                x: 50, y: 50,
                width: 300, height: 200,
                scale: 1, rotation: 0,
                zIndex: prev.length + 1
              }]);
            };
          });
        }

        function updateImage(id, props) {
          setImages(prev => prev.map(img => img.id === id ? { ...img, ...props } : img));
        }

        function deleteImage(id) {
          setImages(prev => prev.filter(img => img.id !== id));
        }

        function addHeadline() {
          setHeadlines(prev => [...prev, {
            id: Date.now(),
            text: "نئی سرخی درج کریں",
            fontSize: 35,
            lineHeight: 1.3,
            fontFamily: "'Noto Sans Arabic', sans-serif",
            textColor: "#ffffff",
            bgColor: "transparent",
            rotation: 0,
            textPos: { x: 50, y: 200 },
            direction: "rtl",
            textAlign: "right",
            shadow: { enabled: true, offsetX: 2, offsetY: 2, blur: 6, color: "rgba(0,0,0,0.6)" },
            width: 600
          }]);
        }

        function updateHeadline(id, props) {
          setHeadlines(prev => prev.map(h => h.id === id ? { ...h, ...props } : h));
        }

        function deleteHeadline(id) {
          setHeadlines(prev => prev.filter(h => h.id !== id));
        }

        function startDrag(e, type, id) {
          e.preventDefault();
          const startX = e.touches ? e.touches[0].clientX : e.clientX;
          const startY = e.touches ? e.touches[0].clientY : e.clientY;

          if (type === 'image') {
            const target = images.find(img => img.id === id);
            if(!target) return;
            const initX = target.x, initY = target.y;

            function onMove(ev) {
              const curX = ev.touches ? ev.touches[0].clientX : ev.clientX;
              const curY = ev.touches ? ev.touches[0].clientY : ev.clientY;
              updateImage(id, { x: initX + (curX - startX), y: initY + (curY - startY) });
            }
            function onUp() {
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
              window.removeEventListener('touchmove', onMove);
              window.removeEventListener('touchend', onUp);
            }
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onUp);
          } else if (type === 'headline' && draggableHeadlines) {
            const target = headlines.find(h => h.id === id);
            if(!target) return;
            const initX = target.textPos.x, initY = target.textPos.y;

            function onMove(ev) {
              const curX = ev.touches ? ev.touches[0].clientX : ev.clientX;
              const curY = ev.touches ? ev.touches[0].clientY : ev.clientY;
              updateHeadline(id, { textPos: { x: initX + (curX - startX), y: initY + (curY - startY) } });
            }
            function onUp() {
              window.removeEventListener('mousemove', onMove);
              window.removeEventListener('mouseup', onUp);
              window.removeEventListener('touchmove', onMove);
              window.removeEventListener('touchend', onUp);
            }
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onUp);
            window.addEventListener('touchmove', onMove);
            window.addEventListener('touchend', onUp);
          }
        }

        function exportImage() {
          if (!containerRef.current) return;
          html2canvas(containerRef.current, { useCORS: true, scale: 1.5 }).then(canvas => {
            const link = document.createElement('a');
            link.download = `${fileName || 'card'}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }

        if (!isAuthenticated) {
          return (
            <div className="flex items-center justify-center min-h-screen bg-gray-950">
              <form onSubmit={(e) => {
                e.preventDefault();
                if (e.target.elements.password.value === "sabah123") {
                  setIsAuthenticated(true);
                  localStorage.setItem('socialCardAuth', 'true');
                } else alert("پاسورڈ غلط ہے!");
              }} className="p-8 bg-gray-800 rounded-xl shadow-2xl border border-gray-700 w-96 text-center">
                <h2 className="text-2xl font-bold mb-4 text-blue-400">سوشل کارڈ اسٹوڈیو</h2>
                <input
                  type="password"
                  name="password"
                  placeholder="پاسورڈ درج کریں"
                  className="w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-md mb-4 text-center text-white focus:outline-none focus:border-blue-500"
                />
                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-md transition">
                  لاگ ان کریں
                </button>
              </form>
            </div>
          );
        }

        const bgStyle = background.type === 'solid'
          ? { backgroundColor: background.color }
          : background.type === 'gradient'
          ? { backgroundImage: `linear-gradient(${background.gradient.direction}, ${background.gradient.color1}, ${background.gradient.color2})` }
          : { backgroundImage: `url(${background.imageSrc})`, backgroundSize: 'cover', backgroundPosition: 'center' };

        return (
          <div className="flex flex-col h-screen overflow-hidden">
            <header className="bg-gray-800 border-b border-gray-700 px-6 py-3 flex justify-between items-center">
              <h1 className="text-xl font-bold text-blue-400">Social Card Studio Pro</h1>
              <div className="flex gap-3">
                <input
                  type="text"
                  value={fileName}
                  onChange={e => setFileName(e.target.value)}
                  className="bg-gray-900 border border-gray-700 px-3 py-1 rounded text-sm w-40 text-white"
                  placeholder="فائل کا نام"
                />
                <button onClick={exportImage} className="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 rounded font-bold text-sm transition text-white">
                  ایکسپورٹ تصویر (PNG)
                </button>
              </div>
            </header>

            <div className="flex flex-1 overflow-hidden">
              <div className="w-96 bg-gray-800 border-r border-gray-700 flex flex-col">
                <div className="flex border-b border-gray-700 bg-gray-850">
                  {['text', 'images', 'bg', 'presets'].map(tab => (
                    <button
                      key={tab}
                      onClick={() => setActiveTab(tab)}
                      className={`flex-1 py-3 text-xs font-bold uppercase transition ${activeTab === tab ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-700'}`}
                    >
                      {tab === 'text' ? 'ٹیکسٹ' : tab === 'images' ? 'تصاویر' : tab === 'bg' ? 'بیک گراؤنڈ' : 'پرسیٹس'}
                    </button>
                  ))}
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-4">
                  {activeTab === 'text' && (
                    <div className="space-y-4">
                      <div className="flex justify-between items-center">
                        <span className="text-sm font-bold text-gray-300">سرخیاں (Headlines)</span>
                        <button onClick={addHeadline} className="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-1.5 rounded font-bold">+ نئی سرخی</button>
                      </div>

                      <div className="flex items-center gap-2 mb-2">
                        <input
                          type="checkbox"
                          id="dragCheck"
                          checked={draggableHeadlines}
                          onChange={e => setDraggableHeadlines(e.target.checked)}
                        />
                        <label htmlFor="dragCheck" className="text-xs text-gray-300">ماؤس سے ڈریگنگ فعال کریں</label>
                      </div>

                      {headlines.map((h, i) => (
                        <div key={h.id} className="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-3">
                          <div className="flex justify-between items-center">
                            <span className="text-xs font-bold text-blue-400">سرخی #{i + 1}</span>
                            <button onClick={() => deleteHeadline(h.id)} className="text-red-400 text-xs">حذف کریں</button>
                          </div>
                          <textarea
                            value={h.text}
                            onChange={e => updateHeadline(h.id, { text: e.target.value })}
                            className="w-full bg-gray-800 border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-blue-500"
                            rows="2"
                          />

                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div>
                              <label className="text-gray-400">فونٹ چنیں:</label>
                              <select
                                value={h.fontFamily}
                                onChange={e => updateHeadline(h.id, { fontFamily: e.target.value })}
                                className="w-full bg-gray-800 border border-gray-700 rounded p-1 text-xs text-white"
                              >
                                <option value="'Jameel Noori Nastaleeq', serif">جمیل نوری نستعلیق</option>
                                <option value="'Gulzar', serif">گلزار (Gulzar)</option>
                                <option value="'Baloo Bhaijaan 2', cursive">بالو بھائی جان (Modern)</option>
                                <option value="'Noto Sans Arabic', sans-serif">نوٹو سنس (Clean)</option>
                                <option value="'Amiri', serif">امیری (Traditional)</option>
                                <option value="'Montserrat', sans-serif">مونسریٹ (English)</option>
                              </select>
                            </div>

                            <div>
                              <label className="text-gray-400">سائز (Size):</label>
                              <input
                                type="number"
                                value={h.fontSize}
                                onChange={e => updateHeadline(h.id, { fontSize: Number(e.target.value) })}
                                className="w-full bg-gray-800 border border-gray-700 rounded p-1 text-white"
                              />
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div>
                              <label className="text-gray-400 block mb-1">ٹیکسٹ رنگ:</label>
                              <input
                                type="color"
                                value={h.textColor}
                                onChange={e => updateHeadline(h.id, { textColor: e.target.value })}
                                className="w-full h-8 bg-gray-800 border border-gray-700 rounded cursor-pointer"
                              />
                            </div>
                            <div>
                              <label className="text-gray-400 block mb-1">بیک گراؤنڈ رنگ:</label>
                              <input
                                type="color"
                                value={h.bgColor === 'transparent' ? '#000000' : h.bgColor}
                                onChange={e => updateHeadline(h.id, { bgColor: e.target.value })}
                                className="w-full h-8 bg-gray-800 border border-gray-700 rounded cursor-pointer"
                              />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'images' && (
                    <div className="space-y-4">
                      <input
                        type="file"
                        accept="image/*"
                        multiple
                        onChange={onImageUpload}
                        className="w-full bg-gray-900 border border-gray-700 p-2 rounded text-xs text-white"
                      />

                      {images.map((img, i) => (
                        <div key={img.id} className="bg-gray-900 p-3 rounded-lg border border-gray-700 space-y-3">
                          <div className="flex justify-between items-center text-xs">
                            <span className="font-bold text-blue-400">تصویر #{i + 1}</span>
                            <button onClick={() => deleteImage(img.id)} className="text-red-400">حذف کریں</button>
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div>
                              <label className="text-gray-400">اسکیل: {img.scale}</label>
                              <input
                                type="range" min="0.2" max="3" step="0.05"
                                value={img.scale}
                                onChange={e => updateImage(img.id, { scale: Number(e.target.value) })}
                                className="w-full"
                              />
                            </div>
                            <div>
                              <label className="text-gray-400">روٹیشن: {img.rotation}°</label>
                              <input
                                type="range" min="-180" max="180"
                                value={img.rotation}
                                onChange={e => updateImage(img.id, { rotation: Number(e.target.value) })}
                                className="w-full"
                              />
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'bg' && (
                    <div className="space-y-4 text-xs">
                      <div>
                        <label className="text-gray-400 block mb-1">بیک گراؤنڈ قسم:</label>
                        <select
                          value={background.type}
                          onChange={e => setBackground({ ...background, type: e.target.value })}
                          className="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white"
                        >
                          <option value="solid">سادہ رنگ (Solid)</option>
                          <option value="gradient">گریڈینٹ (Gradient)</option>
                          <option value="image">تصویر (Image)</option>
                        </select>
                      </div>

                      {background.type === 'solid' && (
                        <div>
                          <label className="text-gray-400 block mb-1">رنگ منتخب کریں:</label>
                          <input
                            type="color"
                            value={background.color}
                            onChange={e => setBackground({ ...background, color: e.target.value })}
                            className="w-full h-10 bg-gray-900 border border-gray-700 rounded"
                          />
                        </div>
                      )}

                      {background.type === 'gradient' && (
                        <div className="space-y-2">
                          <div className="flex justify-between items-center">
                            <span>پہلا رنگ:</span>
                            <input
                              type="color"
                              value={background.gradient.color1}
                              onChange={e => setBackground({ ...background, gradient: { ...background.gradient, color1: e.target.value } })}
                            />
                          </div>
                          <div className="flex justify-between items-center">
                            <span>دوسرا رنگ:</span>
                            <input
                              type="color"
                              value={background.gradient.color2}
                              onChange={e => setBackground({ ...background, gradient: { ...background.gradient, color2: e.target.value } })}
                            />
                          </div>
                        </div>
                      )}

                      {background.type === 'image' && (
                        <input
                          type="file"
                          accept="image/*"
                          onChange={e => {
                            const file = e.target.files[0];
                            if (file) {
                              const reader = new FileReader();
                              reader.onload = ev => setBackground({ ...background, imageSrc: ev.target.result });
                              reader.readAsDataURL(file);
                            }
                          }}
                          className="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white"
                        />
                      )}
                    </div>
                  )}

                  {activeTab === 'presets' && (
                    <div className="space-y-4 text-xs">
                      <div>
                        <label className="text-gray-400 block mb-1">محفوظ شدہ پرسیٹ چنیں:</label>
                        <select
                          onChange={e => loadPreset(e.target.value)}
                          className="w-full bg-gray-900 border border-gray-700 p-2 rounded text-white"
                        >
                          <option value="">پرسیٹ منتخب کریں...</option>
                          {Object.keys(presets).map(p => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>

                      <div className="flex gap-2">
                        <input
                          type="text"
                          placeholder="پرسیٹ کا نام"
                          value={currentPresetName}
                          onChange={e => setCurrentPresetName(e.target.value)}
                          className="flex-1 bg-gray-900 border border-gray-700 p-2 rounded text-white"
                        />
                        <button onClick={savePreset} className="bg-emerald-600 px-4 rounded font-bold text-white">سیو</button>
                      </div>
                    </div>
                  )}
                </div>
              </div>

              <div className="flex-1 bg-gray-950 flex justify-center items-center p-6 overflow-auto">
                <div
                  ref={containerRef}
                  id="canvas-container"
                  className="relative overflow-hidden shadow-2xl transition-all"
                  style={{
                    width: `${width}px`,
                    height: `${height}px`,
                    ...bgStyle
                  }}
                >
                  {images.map(img => (
                    <div
                      key={img.id}
                      onMouseDown={e => startDrag(e, 'image', img.id)}
                      onTouchStart={e => startDrag(e, 'image', img.id)}
                      style={{
                        position: 'absolute',
                        left: `${img.x}px`,
                        top: `${img.y}px`,
                        transform: `scale(${img.scale}) rotate(${img.rotation}deg)`,
                        transformOrigin: 'center center',
                        cursor: 'grab',
                        zIndex: img.zIndex
                      }}
                    >
                      <img src={img.src} style={{ width: `${img.width}px`, height: `${img.height}px`, objectFit: 'cover' }} alt="" />
                    </div>
                  ))}

                  {headlines.map(h => (
                    <div
                      key={h.id}
                      onMouseDown={e => startDrag(e, 'headline', h.id)}
                      onTouchStart={e => startDrag(e, 'headline', h.id)}
                      style={{
                        position: 'absolute',
                        left: `${h.textPos.x}px`,
                        top: `${h.textPos.y}px`,
                        width: `${h.width}px`,
                        color: h.textColor,
                        backgroundColor: h.bgColor,
                        fontSize: `${h.fontSize}px`,
                        lineHeight: h.lineHeight,
                        fontFamily: h.fontFamily,
                        direction: h.direction,
                        textAlign: h.textAlign,
                        transform: `rotate(${h.rotation}deg)`,
                        textShadow: h.shadow.enabled ? `${h.shadow.offsetX}px ${h.shadow.offsetY}px ${h.shadow.blur}px ${h.shadow.color}` : 'none',
                        cursor: draggableHeadlines ? 'move' : 'default',
                        userSelect: 'none',
                        zIndex: 1000
                      }}
                    >
                      {h.text}
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<SocialCardStudio />);
    </script>
  </body>
</html>
